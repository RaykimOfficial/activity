<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FIRIKIK TV</title>

  <style>
    * {
      box-sizing: border-box;
    }
  

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #080a0d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #080a0d;
    }

    #topbar {
      height: 52px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: #0d1117;
      border-bottom: 1px solid #20252c;
    }

    #logo {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    #logo span {
      color: #3cff84;
    }

    #channelName {
      font-size: 13px;
      color: #aeb6c2;
      text-align: right;
    }

    #playerArea {
      position: relative;
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 0;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      background: black;
      object-fit: contain;
    }

    #loading {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 12px;

      background: #080a0d;
      z-index: 5;
    }

    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #252a31;
      border-top-color: #3cff84;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loadingText {
      font-size: 14px;
      color: #b8c0cb;
    }

    #errorBox {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #080a0d;
      z-index: 10;
    }

    #errorCard {
      width: min(520px, 100%);

      padding: 25px;

      border: 1px solid #292f37;
      border-radius: 14px;

      background: #11161c;

      text-align: center;
    }

    #errorCard h2 {
      margin: 0 0 10px;
      color: #ff6464;
      font-size: 20px;
    }

    #errorMessage {
      margin: 0;
      color: #b9c0ca;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="topbar">
      <div id="logo">
        FIRIKIK <span>TV</span>
      </div>

      <div id="channelName">
        Kanal yükleniyor...
      </div>
    </div>

    <div id="playerArea">

      <video
        id="video"
        controls
        autoplay
        playsinline
      ></video>

      <div id="loading">
        <div class="spinner"></div>

        <div id="loadingText">
          Yayın hazırlanıyor...
        </div>
      </div>

      <div id="errorBox">
        <div id="errorCard">
          <h2>Yayın açılamadı</h2>

          <p id="errorMessage"></p>
        </div>
      </div>

    </div>

  </div>


  <script src="hls.min.js"></script>
  <script src="mpegts.js"></script>


  <script>
    const video = document.getElementById("video");

    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");

    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");

    const channelName = document.getElementById("channelName");


    // =====================================================
    // KANALLAR
    // =====================================================

    const CHANNELS = {

      trt1: {
        name: "TRT 1",
        type: "hls",
        url: "/trt/master_720.m3u8"
      },

      bein1: {
        name: "BEIN SPORTS 1 HD",
        type: "mpegts",
        url: "/bein/224163"
      },

      bein2: {
        name: "BEIN SPORTS 2 FHD",
        type: "mpegts",
        url: "/bein/224170"
      },

      bein3: {
        name: "BEIN SPORTS 3 HD",
        type: "mpegts",
        url: "/bein/224172"
      }

    };


    let currentPlayer = null;


    // =====================================================
    // HATA
    // =====================================================

    function showError(message) {

      console.error(message);

      loading.style.display = "none";

      errorMessage.textContent = message;

      errorBox.style.display = "flex";
    }


    // =====================================================
    // PLAYER TEMİZLE
    // =====================================================

    function destroyPlayer() {

      if (!currentPlayer) {
        return;
      }

      try {

        if (typeof currentPlayer.destroy === "function") {
          currentPlayer.destroy();
        }

      } catch (error) {

        console.warn(
          "Player kapatılırken hata:",
          error
        );

      }

      currentPlayer = null;
    }


    // =====================================================
    // TRT / HLS
    // =====================================================

    function playHls(channel) {

      loadingText.textContent =
        `${channel.name} yükleniyor...`;

      if (video.canPlayType(
        "application/vnd.apple.mpegurl"
      )) {

        video.src = channel.url;

        video.play().catch(() => {});

        return;
      }


      if (!window.Hls) {

        showError(
          "HLS oynatıcı yüklenemedi."
        );

        return;
      }


      if (!Hls.isSupported()) {

        showError(
          "Bu cihaz HLS yayınını desteklemiyor."
        );

        return;
      }


      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      currentPlayer = hls;

      hls.loadSource(
        channel.url
      );

      hls.attachMedia(
        video
      );


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        () => {

          video
            .play()
            .catch(() => {});

        }
      );


      hls.on(
        Hls.Events.ERROR,
        (event, data) => {

          console.error(
            "HLS ERROR:",
            data
          );

          if (data.fatal) {

            showError(
              `${channel.name} yayını oynatılamadı.`
            );

          }

        }
      );
    }


    // =====================================================
    // BEIN / MPEG-TS
    // =====================================================

    function playMpegTs(channel) {

      loadingText.textContent =
        `${channel.name} yükleniyor...`;


      if (
        !window.mpegts ||
        !mpegts.isSupported()
      ) {

        showError(
          "MPEG-TS oynatıcı bu cihazda desteklenmiyor."
        );

        return;
      }


      const player = mpegts.createPlayer(

        {
          type: "mse",
          isLive: true,
          url: channel.url,
          cors: true,
          withCredentials: false
        },

        {
          enableWorker: false,
          enableWorkerForMSE: false,

          enableStashBuffer: false,
          stashInitialSize: 128,

          liveBufferLatencyChasing: true,
          liveBufferLatencyMaxLatency: 3,
          liveBufferLatencyMinRemain: 0.5
        }

      );


      currentPlayer = player;


      player.attachMediaElement(
        video
      );


      player.load();


      player.play().catch(
        (error) => {

          console.warn(
            "Otomatik oynatma:",
            error
          );

        }
      );


      player.on(
        mpegts.Events.ERROR,
        (errorType, errorDetail, errorInfo) => {

          console.error(
            "MPEGTS ERROR:",
            errorType,
            errorDetail,
            errorInfo
          );

        }
      );
    }


    // =====================================================
    // KANALI AÇ
    // =====================================================

    function playChannel(channelKey) {

      const channel =
        CHANNELS[channelKey];


      if (!channel) {

        showError(
          `Bilinmeyen kanal: ${channelKey}`
        );

        return;
      }


      destroyPlayer();


      channelName.textContent =
        channel.name;


      document.title =
        `${channel.name} • FIRIKIK TV`;


      if (channel.type === "hls") {

        playHls(
          channel
        );

        return;
      }


      if (channel.type === "mpegts") {

        playMpegTs(
          channel
        );

        return;
      }


      showError(
        "Bilinmeyen yayın türü."
      );
    }


    // =====================================================
    // VIDEO HAZIR OLUNCA LOADING KAPAT
    // =====================================================

    video.addEventListener(
      "playing",
      () => {

        loading.style.display =
          "none";

      }
    );


    video.addEventListener(
      "waiting",
      () => {

        loading.style.display =
          "flex";

      }
    );


    video.addEventListener(
      "error",
      () => {

        console.error(
          "VIDEO ERROR:",
          video.error
        );

      }
    );


    // =====================================================
    // DISCORD BİLGİLERİNİ AL
    // =====================================================

    async function start() {

      try {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const guildId =
          params.get("guild_id");


        const voiceChannelId =
          params.get("channel_id");


        console.log(
          "Guild ID:",
          guildId
        );

        console.log(
          "Voice Channel ID:",
          voiceChannelId
        );


        if (
          !guildId ||
          !voiceChannelId
        ) {

          showError(
            "Discord sunucu veya ses kanalı bilgisi alınamadı. " +
            "Bu sayfayı normal tarayıcıdan değil, Discord Activity üzerinden aç."
          );

          return;
        }


        loadingText.textContent =
          "Seçilen kanal bulunuyor...";


        const apiUrl =
          `/api/selection` +
          `?guild_id=${encodeURIComponent(guildId)}` +
          `&voice_channel_id=${encodeURIComponent(voiceChannelId)}`;


        console.log(
          "Selection API:",
          apiUrl
        );


        const response =
          await fetch(
            apiUrl,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            `Worker geçersiz cevap verdi: ${text.slice(0, 300)}`
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            `Worker hatası: ${response.status}`
          );

        }


        if (!data.ok) {

          throw new Error(
            data.error ||
            "Kanal seçimi alınamadı."
          );

        }


        console.log(
          "Seçilen kanal:",
          data.channel
        );


        playChannel(
          data.channel
        );

      } catch (error) {

        console.error(
          error
        );

        showError(
          error.message ||
          String(error)
        );

      }

    }


    start();
  </script>

</body>
</html>
