<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FIRIKIK TV</title>

  <style>
    * {
      box-sizing: border-box;
    }
  

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #080a0d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #080a0d;
    }

    #topbar {
      height: 52px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 18px;

      background: #0d1117;
      border-bottom: 1px solid #20252c;
    }

    #logo {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    #logo span {
      color: #3cff84;
    }

    #channelName {
      font-size: 13px;
      color: #aeb6c2;
      text-align: right;
    }

    #playerArea {
      position: relative;
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 0;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      background: black;
      object-fit: contain;
    }

    #loading {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 12px;

      background: #080a0d;
      z-index: 5;
    }

    .spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #252a31;
      border-top-color: #3cff84;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loadingText {
      font-size: 14px;
      color: #b8c0cb;
    }

    #errorBox {
      position: absolute;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #080a0d;
      z-index: 10;
    }

    #errorCard {
      width: min(520px, 100%);

      padding: 25px;

      border: 1px solid #292f37;
      border-radius: 14px;

      background: #11161c;

      text-align: center;
    }

    #errorCard h2 {
      margin: 0 0 10px;
      color: #ff6464;
      font-size: 20px;
    }

    #errorMessage {
      margin: 0;
      color: #b9c0ca;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div id="app">

    <div id="topbar">
      <div id="logo">
        FIRIKIK <span>TV</span>
      </div>

      <div id="channelName">
        Kanal yükleniyor...
      </div>
    </div>

    <div id="playerArea">

      <video
        id="video"
        controls
        autoplay
        playsinline
      ></video>

      <div id="loading">
        <div class="spinner"></div>

        <div id="loadingText">
          Yayın hazırlanıyor...
        </div>
      </div>

      <div id="errorBox">
        <div id="errorCard">
          <h2>Yayın açılamadı</h2>

          <p id="errorMessage"></p>
        </div>
      </div>

    </div>

  </div>


  <script src="hls.min.js"></script>
  <script src="mpegts.js"></script>


  <script type="module">
    import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk/+esm";

    const DISCORD_CLIENT_ID = "1550162030437339256";
    const discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);

    const video = document.getElementById("video");

    const loading = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");

    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");

    const channelName = document.getElementById("channelName");


    // =====================================================
    // KANALLAR
    // =====================================================

    const CHANNELS = {
  trt1: {
    name: "TRT 1",
    type: "hls",
    url: "/trt/master_720.m3u8"
  },

  bein1: {
  name: "BEIN SPORTS 1 HD",
  type: "mpegts",
  url: "http://yalaztv.xyz:8080/Mesut34/483907/98732"
}

  bein2: {
    name: "BEIN SPORTS 2 HD",
    type: "mpegts",
    url: "/bein/bein2"
  },

  bein3: {
    name: "BEIN SPORTS 3 HD",
    type: "mpegts",
    url: "/bein/bein3"
  },

  bein4: {
    name: "BEIN SPORTS 4 HD",
    type: "mpegts",
    url: "/bein/bein4"
  },

  bein5: {
    name: "BEIN SPORTS 5 HD",
    type: "mpegts",
    url: "/bein/bein5"
  }
};

    let currentPlayer = null;

    // BEIN / MPEG-TS canlı yayın gecikme kontrolü
    let liveDelayTimer = null;
    const MAX_LIVE_DELAY_SECONDS = 10;
    const LIVE_EDGE_SAFETY_SECONDS = 3;

    // Yayın başladıktan sonra kısa takılmalarda loading ekranı
    // anında görünmesin. 2 saniye sürerse göster.
    let loadingDelayTimer = null;
    let hasStartedPlayback = false;

    const LOADING_DELAY_MS = 2000;

    // Kullanıcı bazlı seçim takibi
    let currentChannelKey = null;
    let currentUserId = null;
    let currentGuildId = null;
    let currentVoiceChannelId = null;

    // Discord access token'ı tekrar tekrar izin istememesi için sakla.
    const DISCORD_TOKEN_STORAGE_KEY = "firikik_discord_access_token";


    // =====================================================
    // LOADING KONTROLÜ
    // =====================================================

    function clearLoadingDelay() {
      if (loadingDelayTimer !== null) {
        clearTimeout(loadingDelayTimer);
        loadingDelayTimer = null;
      }
    }


    function showLoadingNow() {
      clearLoadingDelay();
      loading.style.display = "flex";
    }


    function hideLoading() {
      clearLoadingDelay();
      loading.style.display = "none";
    }


    function scheduleLoading() {
      clearLoadingDelay();

      if (!hasStartedPlayback) {
        loading.style.display = "flex";
        return;
      }

      loadingDelayTimer = setTimeout(() => {
        if (
          video.paused === false &&
          video.readyState < HTMLMediaElement.HAVE_FUTURE_DATA
        ) {
          loading.style.display = "flex";
        }

        loadingDelayTimer = null;
      }, LOADING_DELAY_MS);
    }


    // =====================================================
    // HATA
    // =====================================================

    function showError(message) {

      console.error(message);

      loading.style.display = "none";

      errorMessage.textContent = message;

      errorBox.style.display = "flex";
    }


    // =====================================================
    // PLAYER TEMİZLE
    // =====================================================

    function destroyPlayer() {

      clearLoadingDelay();
      hasStartedPlayback = false;

      if (liveDelayTimer !== null) {
        clearInterval(liveDelayTimer);
        liveDelayTimer = null;
      }

      if (!currentPlayer) {
        return;
      }

      try {

        if (typeof currentPlayer.destroy === "function") {
          currentPlayer.destroy();
        }

      } catch (error) {

        console.warn(
          "Player kapatılırken hata:",
          error
        );

      }

      currentPlayer = null;
    }


    // =====================================================
    // TRT / HLS
    // =====================================================

    function playHls(channel) {

      loadingText.textContent =
        `${channel.name} yükleniyor...`;

      showLoadingNow();

      if (video.canPlayType(
        "application/vnd.apple.mpegurl"
      )) {

        video.src = channel.url;

        video.play().catch(() => {});

        return;
      }


      if (!window.Hls) {

        showError(
          "HLS oynatıcı yüklenemedi."
        );

        return;
      }


      if (!Hls.isSupported()) {

        showError(
          "Bu cihaz HLS yayınını desteklemiyor."
        );

        return;
      }


      const hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      currentPlayer = hls;

      hls.loadSource(
        channel.url
      );

      hls.attachMedia(
        video
      );


      hls.on(
        Hls.Events.MANIFEST_PARSED,
        () => {

          video
            .play()
            .catch(() => {});

        }
      );


      hls.on(
        Hls.Events.ERROR,
        (event, data) => {

          console.error(
            "HLS ERROR:",
            data
          );

          if (data.fatal) {

            showError(
              `${channel.name} yayını oynatılamadı.`
            );

          }

        }
      );
    }


    // =====================================================
    // BEIN / MPEG-TS
    // =====================================================

    function playMpegTs(channel) {

      loadingText.textContent =
        `${channel.name} yükleniyor...`;

      showLoadingNow();


      if (
        !window.mpegts ||
        !mpegts.isSupported()
      ) {

        showError(
          "MPEG-TS oynatıcı bu cihazda desteklenmiyor."
        );

        return;
      }


      const player = mpegts.createPlayer(

        {
          type: "mse",
          isLive: true,
          url: channel.url,
          cors: true,
          withCredentials: false
        },

        {
          enableWorker: false,
          enableWorkerForMSE: false,

          // İnternet dalgalanmalarında bağlantıyı korumak için
          // daha geniş bir ağ tamponu kullan.
          enableStashBuffer: true,
          stashInitialSize: 1024 * 1024,

          // Canlı yayında gereksiz dur-kalk davranışını azalt.
          lazyLoad: false,

          // Uzun maçlarda MSE buffer'ının sınırsız büyümesini önle.
          autoCleanupSourceBuffer: true,
          autoCleanupMaxBackwardDuration: 120,
          autoCleanupMinBackwardDuration: 60,

          // Oynatıcı kendi kendine sürekli canlı ucu kovalamayacak.
          // 10 saniye sınırını aşağıdaki özel kontrol yönetiyor.
          liveBufferLatencyChasing: false
        }

      );


      currentPlayer = player;


      player.attachMediaElement(
        video
      );


      player.load();


      // BEIN yayınlarında 10 saniyeye kadar gecikmeye izin ver.
      // 10 saniyeyi aşarsa canlı ucun tam dibine değil,
      // 3 saniye gerisine geçerek yeniden takılma ihtimalini azalt.
      liveDelayTimer = setInterval(() => {

        if (
          currentPlayer !== player ||
          video.paused ||
          video.buffered.length === 0
        ) {
          return;
        }

        const lastRange =
          video.buffered.length - 1;

        const liveEdge =
          video.buffered.end(lastRange);

        const bufferedStart =
          video.buffered.start(lastRange);

        const delay =
          liveEdge - video.currentTime;

        if (delay > MAX_LIVE_DELAY_SECONDS) {

          const targetTime =
            Math.max(
              bufferedStart,
              liveEdge - LIVE_EDGE_SAFETY_SECONDS
            );

          console.log(
            `BEIN yayını ${delay.toFixed(1)} sn geride. Canlıya dönülüyor.`
          );

          try {
            video.currentTime = targetTime;
          } catch (error) {
            console.warn(
              "Canlı yayın ucuna geçilemedi:",
              error
            );
          }
        }

      }, 3000);


      // Son çare: akış veri üretmeye başladıysa birkaç kez kontrol edip
      // loading ekranını kaldır. Sürekli polling değil; sadece açılışta kısa kontrol.
      let startupChecks = 0;

      const startupCheckTimer = setInterval(() => {

        startupChecks += 1;

        if (
          video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA ||
          video.currentTime > 0
        ) {

          hideLoading();
          clearInterval(startupCheckTimer);

        } else if (startupChecks >= 20) {

          clearInterval(startupCheckTimer);

        }

      }, 250);


      player.play()
        .then(() => {

          // MPEG-TS yayını gerçekten başlamışsa loading ekranını kapat.
          markPlaybackStarted();

        })
        .catch(
          (error) => {

            console.warn(
              "Otomatik oynatma:",
              error
            );

          }
        );


      // Bazı MPEG-TS akışlarında standart video eventleri
      // güvenilir şekilde gelmeyebiliyor. Medya bilgisi geldiğinde
      // oynatıcı veri almaya başlamış demektir; loading'i kapat.
      if (mpegts.Events.MEDIA_INFO) {

        player.on(
          mpegts.Events.MEDIA_INFO,
          () => {

            hideLoading();

          }
        );

      }


      player.on(
        mpegts.Events.ERROR,
        (errorType, errorDetail, errorInfo) => {

          console.error(
            "MPEGTS ERROR:",
            errorType,
            errorDetail,
            errorInfo
          );

        }
      );
    }


    // =====================================================
    // KANALI AÇ
    // =====================================================

    function playChannel(channelKey) {

      const channel =
        CHANNELS[channelKey];


      if (!channel) {

        showError(
          `Bilinmeyen kanal: ${channelKey}`
        );

        return;
      }


      if (currentChannelKey === channelKey) {
        return;
      }


      currentChannelKey = channelKey;

      destroyPlayer();


      channelName.textContent =
        channel.name;


      document.title =
        `${channel.name} • FIRIKIK TV`;


      if (channel.type === "hls") {

        playHls(
          channel
        );

        return;
      }


      if (channel.type === "mpegts") {

        playMpegTs(
          channel
        );

        return;
      }


      showError(
        "Bilinmeyen yayın türü."
      );
    }


    // =====================================================
    // VIDEO DURUMU
    // =====================================================

    function markPlaybackStarted() {
      hasStartedPlayback = true;
      hideLoading();
    }


    video.addEventListener(
      "playing",
      markPlaybackStarted
    );


    video.addEventListener(
      "canplay",
      () => {
        if (!video.paused || video.currentTime > 0) {
          markPlaybackStarted();
        }
      }
    );


    video.addEventListener(
      "loadeddata",
      () => {
        // MPEG-TS bazen "playing" eventini geç/kararsız gönderebiliyor.
        // Gerçek medya verisi geldiyse loading'i kaldır.
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          hideLoading();
        }
      }
    );


    video.addEventListener(
      "timeupdate",
      () => {
        // Ses/video gerçekten ilerliyorsa yayın başlamıştır.
        if (video.currentTime > 0) {
          markPlaybackStarted();
        }
      }
    );


    video.addEventListener(
      "waiting",
      () => {
        scheduleLoading();
      }
    );


    video.addEventListener(
      "stalled",
      () => {
        scheduleLoading();
      }
    );


    video.addEventListener(
      "error",
      () => {
        console.error(
          "VIDEO ERROR:",
          video.error
        );
      }
    );


    // =====================================================
    // DISCORD BİLGİLERİNİ AL
    // =====================================================

    async function exchangeCodeForToken(code) {

      const tokenResponse =
        await fetch(
          "/api/token",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                code: code
              }),

            cache:
              "no-store"
          }
        );


      const tokenText =
        await tokenResponse.text();


      let tokenData;


      try {

        tokenData =
          JSON.parse(tokenText);

      } catch {

        throw new Error(
          `Token servisi geçersiz cevap verdi: ${tokenText.slice(0, 300)}`
        );

      }


      if (!tokenResponse.ok) {

        throw new Error(
          tokenData.error ||
          `Token servisi hatası: ${tokenResponse.status}`
        );

      }


      if (!tokenData.access_token) {

        throw new Error(
          "Discord access token alınamadı."
        );

      }


      return tokenData.access_token;
    }


    async function getAuthenticatedUser() {

      // Önce daha önce saklanan token varsa onu dene.
      const cachedToken =
        localStorage.getItem(
          DISCORD_TOKEN_STORAGE_KEY
        );


      if (cachedToken) {

        try {

          const cachedAuth =
            await discordSdk.commands.authenticate({
              access_token:
                cachedToken
            });


          if (
            cachedAuth &&
            cachedAuth.user &&
            cachedAuth.user.id
          ) {

            console.log(
              "Discord oturumu önbellekten doğrulandı."
            );

            return cachedAuth.user;

          }

        } catch (error) {

          console.warn(
            "Kayıtlı Discord tokenı geçersiz, yeniden yetkilendirilecek.",
            error
          );

          localStorage.removeItem(
            DISCORD_TOKEN_STORAGE_KEY
          );

        }

      }


      // Geçerli kayıtlı token yoksa bir kere OAuth yetkisi iste.
      const { code } =
        await discordSdk.commands.authorize({

          client_id:
            DISCORD_CLIENT_ID,

          response_type:
            "code",

          state:
            "",

          prompt:
            "none",

          scope: [
            "identify"
          ]

        });


      const accessToken =
        await exchangeCodeForToken(
          code
        );


      const auth =
        await discordSdk.commands.authenticate({
          access_token:
            accessToken
        });


      if (
        !auth ||
        !auth.user ||
        !auth.user.id
      ) {

        throw new Error(
          "Discord kullanıcı bilgisi alınamadı."
        );

      }


      localStorage.setItem(
        DISCORD_TOKEN_STORAGE_KEY,
        accessToken
      );


      return auth.user;
    }


    async function getSelectedChannel() {

      if (
        !currentUserId ||
        !currentGuildId ||
        !currentVoiceChannelId
      ) {

        throw new Error(
          "Discord kullanıcı/sunucu/ses kanalı bilgisi eksik."
        );

      }


      const apiUrl =
        `/api/selection` +
        `?user_id=${encodeURIComponent(currentUserId)}` +
        `&guild_id=${encodeURIComponent(currentGuildId)}` +
        `&voice_channel_id=${encodeURIComponent(currentVoiceChannelId)}`;


      const response =
        await fetch(
          apiUrl,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const responseText =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(responseText);

      } catch {

        throw new Error(
          `Worker geçersiz cevap verdi: ${responseText.slice(0, 300)}`
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `Worker hatası: ${response.status}`
        );

      }


      if (!data.ok) {

        throw new Error(
          data.error ||
          "Kanal seçimi alınamadı."
        );

      }


      return data.channel;
    }




    async function start() {

      try {

        loadingText.textContent =
          "Discord bağlantısı kuruluyor...";


        await discordSdk.ready();


        currentGuildId =
          discordSdk.guildId;


        currentVoiceChannelId =
          discordSdk.channelId;


        console.log(
          "Guild ID:",
          currentGuildId
        );

        console.log(
          "Voice Channel ID:",
          currentVoiceChannelId
        );


        if (
          !currentGuildId ||
          !currentVoiceChannelId
        ) {

          showError(
            "Discord sunucu veya ses kanalı bilgisi alınamadı. " +
            "Bu sayfayı normal tarayıcıdan değil, Discord Activity üzerinden aç."
          );

          return;
        }


        loadingText.textContent =
          "Discord hesabın doğrulanıyor...";


        const user =
          await getAuthenticatedUser();


        currentUserId =
          user.id;


        console.log(
          "Discord User ID:",
          currentUserId
        );


        loadingText.textContent =
          "Seçilen kanal bulunuyor...";


        const selectedChannel =
          await getSelectedChannel();


        console.log(
          "Seçilen kanal:",
          selectedChannel
        );


        playChannel(
          selectedChannel
        );


      } catch (error) {

        console.error(
          error
        );


        showError(
          error.message ||
          String(error)
        );

      }

    }


    start();


  </script>

</body>
</html>
