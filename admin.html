<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>FIRIKIK TV • Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #080a0d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      background: #0d1117;
      border-bottom: 1px solid #20252c;
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
    }

    .logo span {
      color: #3cff84;
    }

    .badge {
      padding: 6px 10px;

      border: 1px solid #2c333d;
      border-radius: 8px;

      background: #151a21;

      color: #aeb6c2;

      font-size: 12px;
      font-weight: 700;
    }

    .container {
      width: min(
        1100px,
        calc(100% - 40px)
      );

      margin: 0 auto;

      padding: 36px 0 60px;
    }

    .login-box {
      width: min(
        460px,
        calc(100% - 40px)
      );

      margin: 100px auto;

      padding: 28px;

      border: 1px solid #252b33;
      border-radius: 14px;

      background: #10151b;

      text-align: center;
    }

    .login-box h1 {
      margin-top: 0;
    }

    .login-box p {
      color: #8f99a7;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 9px;

      padding: 11px 16px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 800;
    }

    .discord-button {
      margin-top: 12px;

      background: #5865f2;
      color: white;
    }

    #panel {
      display: none;
    }

    .page-title {
      margin-bottom: 28px;
    }

    .page-title h1 {
      margin: 0 0 8px;

      font-size: 28px;
    }

    .page-title p {
      margin: 0;

      color: #8f99a7;
    }

    .grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1.2fr);

      gap: 22px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      border: 1px solid #252b33;
      border-radius: 14px;

      background: #10151b;

      overflow: hidden;
    }

    .card-header {
      padding: 18px 20px;

      border-bottom: 1px solid #252b33;

      background: #121820;
    }

    .card-header h2 {
      margin: 0;

      font-size: 16px;
    }

    .card-body {
      padding: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #b8c0cb;

      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;

      border: 1px solid #2c333d;
      border-radius: 9px;

      outline: none;

      padding: 12px 13px;

      background: #0a0e13;
      color: white;
    }

    input:focus,
    textarea:focus {
      border-color: #3cff84;
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .ban-button {
      background: #ef4444;
      color: white;
    }

    .refresh-button,
    .unban-button,
    .logout-button {
      background: #252c35;
      color: white;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ban-list {
      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .ban-item {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 14px;

      padding: 13px 14px;

      border: 1px solid #252b33;
      border-radius: 10px;

      background: #0c1117;
    }

    .ban-id {
      margin-bottom: 4px;

      font-weight: 800;

      word-break: break-all;
    }

    .ban-reason {
      color: #8e98a5;

      font-size: 12px;
    }

    .ban-date {
      margin-top: 4px;

      color: #606976;

      font-size: 11px;
    }

    .empty {
      padding: 30px 10px;

      color: #747e8c;

      text-align: center;
    }

    #message {
      display: none;

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 9px;

      font-size: 13px;
    }

    #message.success {
      display: block;

      border: 1px solid #1b6b3c;

      background: #0e291a;

      color: #76f2aa;
    }

    #message.error {
      display: block;

      border: 1px solid #713838;

      background: #2c1515;

      color: #ff8989;
    }
  </style>
</head>

<body>

  <header class="topbar">

    <div class="logo">
      FIRIKIK <span>TV</span>
    </div>

    <div class="top-actions">

      <div
        id="adminName"
        class="badge"
      >
        ADMIN
      </div>

      <button
        id="logoutButton"
        class="logout-button"
        style="display:none;"
      >
        Çıkış
      </button>

    </div>

  </header>


  <!-- =====================================================
       GİRİŞ
  ====================================================== -->

  <div
    id="loginBox"
    class="login-box"
  >

    <h1>
      FIRIKIK TV Admin
    </h1>

    <p>
      Kullanıcı banlama paneline erişmek için
      Discord hesabınla giriş yap.
    </p>

    <button
      id="loginButton"
      class="discord-button"
    >
      Discord ile Giriş Yap
    </button>

  </div>


  <!-- =====================================================
       PANEL
  ====================================================== -->

  <main
    id="panel"
    class="container"
  >

    <div class="page-title">

      <h1>
        Kullanıcı Banlama
      </h1>

      <p>
        FIRIKIK TV erişimini kullanıcı bazlı yönet.
      </p>

    </div>


    <div class="grid">


      <!-- BAN FORMU -->

      <section class="card">

        <div class="card-header">

          <h2>
            🚫 Kullanıcı Banla
          </h2>

        </div>


        <div class="card-body">

          <div class="field">

            <label>
              Discord Kullanıcı ID
            </label>

            <input
              id="userId"
              type="text"
              inputmode="numeric"
              placeholder="123456789012345678"
            >

          </div>


          <div class="field">

            <label>
              Ban Sebebi
            </label>

            <textarea
              id="reason"
              placeholder="Ban sebebi..."
            ></textarea>

          </div>


          <button
            id="banButton"
            class="ban-button"
          >
            Kullanıcıyı Banla
          </button>


          <div id="message"></div>

        </div>

      </section>


      <!-- BAN LİSTESİ -->

      <section class="card">

        <div class="card-header">

          <div
            style="
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:12px;
            "
          >

            <h2>
              🚷 Yasaklı Kullanıcılar
            </h2>

            <button
              id="refreshButton"
              class="refresh-button"
            >
              Yenile
            </button>

          </div>

        </div>


        <div class="card-body">

          <div
            id="banList"
            class="ban-list"
          >

            <div class="empty">
              Yükleniyor...
            </div>

          </div>

        </div>

      </section>


    </div>

  </main>


  <script>

    // =====================================================
    // AYARLAR
    // =====================================================

    const CLIENT_ID =
      "1550162030437339256";


    const REDIRECT_URI =
      "https://raykimofficial.github.io/activity/admin.html";


    const API_BASE =
      "https://activity.raykimofficial.workers.dev";


    const TOKEN_KEY =
      "firikik_admin_access_token";


    // =====================================================
    // ELEMENTLER
    // =====================================================

    const loginBox =
      document.getElementById(
        "loginBox"
      );


    const panel =
      document.getElementById(
        "panel"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const logoutButton =
      document.getElementById(
        "logoutButton"
      );


    const adminName =
      document.getElementById(
        "adminName"
      );


    const userIdInput =
      document.getElementById(
        "userId"
      );


    const reasonInput =
      document.getElementById(
        "reason"
      );


    const banButton =
      document.getElementById(
        "banButton"
      );


    const refreshButton =
      document.getElementById(
        "refreshButton"
      );


    const banList =
      document.getElementById(
        "banList"
      );


    const message =
      document.getElementById(
        "message"
      );


    // =====================================================
    // TOKEN
    // =====================================================

    function getToken() {

      return localStorage.getItem(
        TOKEN_KEY
      );

    }


    function setToken(
      token
    ) {

      localStorage.setItem(
        TOKEN_KEY,
        token
      );

    }


    function clearToken() {

      localStorage.removeItem(
        TOKEN_KEY
      );

    }


    // =====================================================
    // MESAJ
    // =====================================================

    function showMessage(
      text,
      type
    ) {

      message.className =
        type;

      message.textContent =
        text;

    }


    function clearMessage() {

      message.className =
        "";

      message.textContent =
        "";

    }


    // =====================================================
    // API
    // =====================================================

    async function apiFetch(
      path,
      options = {}
    ) {

      const token =
        getToken();


      const headers = {
        "Content-Type":
          "application/json",

        ...(options.headers || {})
      };


      if (token) {

        headers.Authorization =
          `Bearer ${token}`;

      }


      const response =
        await fetch(
          API_BASE + path,
          {
            ...options,

            headers,

            cache:
              "no-store"
          }
        );


      const text =
        await response.text();


      let data = {};


      if (text) {

        try {

          data =
            JSON.parse(
              text
            );

        } catch {

          throw new Error(
            "Sunucu geçersiz cevap verdi."
          );

        }

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `HTTP ${response.status}`
        );

      }


      return data;

    }


    // =====================================================
    // DISCORD GİRİŞ
    // =====================================================

    function loginWithDiscord() {

      const state =
        crypto.randomUUID();


      sessionStorage.setItem(
        "firikik_admin_oauth_state",
        state
      );


      const params =
        new URLSearchParams();


      params.set(
        "client_id",
        CLIENT_ID
      );


      params.set(
        "response_type",
        "code"
      );


      params.set(
        "redirect_uri",
        REDIRECT_URI
      );


      params.set(
        "scope",
        "identify"
      );


      params.set(
        "state",
        state
      );


      window.location.href =
        "https://discord.com/oauth2/authorize?" +
        params.toString();

    }


    // =====================================================
    // CODE -> TOKEN
    // =====================================================

    async function handleOAuthCallback() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const code =
        params.get(
          "code"
        );


      if (!code) {
        return;
      }


      const returnedState =
        params.get(
          "state"
        );


      const expectedState =
        sessionStorage.getItem(
          "firikik_admin_oauth_state"
        );


      if (
        !returnedState ||
        !expectedState ||
        returnedState !== expectedState
      ) {

        throw new Error(
          "OAuth state doğrulaması başarısız."
        );

      }


      const response =
        await fetch(
          API_BASE +
          "/admin/token",
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                code
              })
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.ok ||
        !data.access_token
      ) {

        throw new Error(
          data.error ||
          "Admin girişi başarısız."
        );

      }


      setToken(
        data.access_token
      );


      sessionStorage.removeItem(
        "firikik_admin_oauth_state"
      );


      window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
      );

    }


    // =====================================================
    // ADMİN DOĞRULA
    // =====================================================

    async function checkAdmin() {

      const token =
        getToken();


      if (!token) {

        loginBox.style.display =
          "block";

        panel.style.display =
          "none";

        return false;

      }


      try {

        const data =
          await apiFetch(
            "/admin/me"
          );


        if (
          !data.ok ||
          !data.admin
        ) {

          throw new Error(
            "Admin yetkisi yok."
          );

        }


        loginBox.style.display =
          "none";


        panel.style.display =
          "block";


        logoutButton.style.display =
          "inline-block";


        adminName.textContent =
          data.user.global_name ||
          data.user.username ||
          "ADMIN";


        return true;


      } catch (error) {

        clearToken();


        loginBox.style.display =
          "block";


        panel.style.display =
          "none";


        logoutButton.style.display =
          "none";


        throw error;

      }

    }


    // =====================================================
    // BAN LİSTESİ
    // =====================================================

    async function loadBans() {

      banList.innerHTML =
        `
          <div class="empty">
            Yükleniyor...
          </div>
        `;


      try {

        const data =
          await apiFetch(
            "/admin/bans"
          );


        const bans =
          data.bans || [];


        if (
          bans.length === 0
        ) {

          banList.innerHTML =
            `
              <div class="empty">
                Yasaklı kullanıcı yok.
              </div>
            `;

          return;

        }


        banList.innerHTML =
          "";


        for (
          const ban of bans
        ) {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "ban-item";


          const info =
            document.createElement(
              "div"
            );


          const id =
            document.createElement(
              "div"
            );


          id.className =
            "ban-id";


          id.textContent =
            ban.user_id;


          const reason =
            document.createElement(
              "div"
            );


          reason.className =
            "ban-reason";


          reason.textContent =
            ban.reason ||
            "Sebep belirtilmedi.";


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "ban-date";


          date.textContent =
            ban.banned_at
              ? new Date(
                  ban.banned_at
                ).toLocaleString(
                  "tr-TR"
                )
              : "";


          info.appendChild(
            id
          );


          info.appendChild(
            reason
          );


          info.appendChild(
            date
          );


          const button =
            document.createElement(
              "button"
            );


          button.className =
            "unban-button";


          button.textContent =
            "Ban Kaldır";


          button.addEventListener(
            "click",
            () => {

              unbanUser(
                ban.user_id
              );

            }
          );


          item.appendChild(
            info
          );


          item.appendChild(
            button
          );


          banList.appendChild(
            item
          );

        }


      } catch (error) {

        banList.innerHTML =
          `
            <div class="empty">
              Ban listesi alınamadı.
            </div>
          `;


        showMessage(
          error.message,
          "error"
        );

      }

    }


    // =====================================================
    // BANLA
    // =====================================================

    async function banUser() {

      clearMessage();


      const userId =
        userIdInput.value.trim();


      const reason =
        reasonInput.value.trim();


      if (
        !/^\d{15,22}$/.test(
          userId
        )
      ) {

        showMessage(
          "Geçerli bir Discord kullanıcı ID'si gir.",
          "error"
        );

        return;

      }


      banButton.disabled =
        true;


      try {

        await apiFetch(
          "/admin/ban",
          {
            method:
              "POST",

            body:
              JSON.stringify({
                user_id:
                  userId,

                reason:
                  reason
              })
          }
        );


        showMessage(
          "Kullanıcı banlandı.",
          "success"
        );


        userIdInput.value =
          "";


        reasonInput.value =
          "";


        await loadBans();


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );


      } finally {

        banButton.disabled =
          false;

      }

    }


    // =====================================================
    // BAN KALDIR
    // =====================================================

    async function unbanUser(
      userId
    ) {

      clearMessage();


      try {

        await apiFetch(
          "/admin/unban",
          {
            method:
              "POST",

            body:
              JSON.stringify({
                user_id:
                  userId
              })
          }
        );


        showMessage(
          "Kullanıcının banı kaldırıldı.",
          "success"
        );


        await loadBans();


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

      }

    }


    // =====================================================
    // ÇIKIŞ
    // =====================================================

    function logout() {

      clearToken();


      window.location.href =
        REDIRECT_URI;

    }


    // =====================================================
    // EVENTLER
    // =====================================================

    loginButton.addEventListener(
      "click",
      loginWithDiscord
    );


    banButton.addEventListener(
      "click",
      banUser
    );


    refreshButton.addEventListener(
      "click",
      loadBans
    );


    logoutButton.addEventListener(
      "click",
      logout
    );


    // =====================================================
    // BAŞLAT
    // =====================================================

    async function start() {

      try {

        await handleOAuthCallback();


        const admin =
          await checkAdmin();


        if (admin) {

          await loadBans();

        }


      } catch (error) {

        console.error(
          error
        );


        alert(
          error.message
        );

      }

    }


    start();

  </script>

</body>
</html>
